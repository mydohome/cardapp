# Nome esplicito: senza "name:", Docker Compose lo deriva dal nome della
# cartella che contiene questo file, rischiando di collidere con un altro
# progetto che si chiami allo stesso modo su questo host.
name: cardapp-dev

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    depends_on:
      - backend
      - frontend

  backup:
    build: ./backup
    restart: unless-stopped
    # crond gira come PID 1: senza un init, il kernel nega alcune operazioni
    # sui gruppi di processo quando lancia i job ("setpgid: Operation not
    # permitted"). init: true fa iniettare a Docker un mini-init (tini).
    init: true
    env_file: .env
    depends_on:
      - postgres
    volumes:
      - ./backups:/backups

  # Ricerca/aggiornamento automatico dei loghi negozio in base alle carte
  # aggiunte (app/update_store_logos.py), a intervalli regolari (di default
  # una volta a settimana, LOGO_UPDATE_INTERVAL_HOURS in .env). Riusa
  # l'immagine backend: stesso codice, stesso accesso al database.
  logo-updater:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    command: ["python", "-m", "app.logo_update_scheduler"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  caddy_data:
