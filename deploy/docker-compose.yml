# Deploy di produzione dietro Nginx Proxy Manager (NPM).
#
# Presupposti:
# - Esiste gia' una rete Docker esterna "proxy-net" condivisa con lo stack di NPM
#   (crearla una tantum con: docker network create proxy-net).
# - Le immagini "app" (backend) e "web" (frontend) vengono buildate direttamente
#   sull'host di produzione da questo stesso repository (come lo stack di
#   sviluppo). Se preferisci pubblicarle su una registry (es. per CI/CD) e
#   scaricarle invece di buildarle, sostituisci "build:" con "image:
#   ghcr.io/<org>/cardapp-frontend:latest" (vedi deploy/README.md).
# - In NPM crei un solo Proxy Host che punta a "cardapp-web:80": il frontend
#   fa da unico punto di ingresso e instrada internamente /api/* al backend
#   (vedi frontend/nginx.conf.template), cosi' l'app resta same-origin.

# Nome del progetto esplicito: senza "name:", Docker Compose lo deriva dal
# nome della CARTELLA ("deploy"), quindi la rete si chiamerebbe
# "deploy_backend" - identica a quella di qualunque altro progetto la cui
# cartella di deploy si chiami anch'essa "deploy" (capitato davvero: la
# rete finiva condivisa con un'altra app sullo stesso host). Con "name:"
# la rete diventa sempre "cardapp_backend", univoca per questo progetto.
name: cardapp

services:
  web:
    build: ../frontend
    container_name: cardapp-web
    restart: unless-stopped
    environment:
      # Il nome del CONTAINER ("cardapp-app"), non del servizio ("app"):
      # "web" e' collegato anche a "proxy-net", condivisa con altre app su
      # questo host. Se una di loro chiama il proprio servizio anch'essa
      # "app" (capitato davvero, con un'app completamente diversa), Docker
      # registra lo stesso alias generico "app" anche li', e la risoluzione
      # DNS puo' restituire quel container invece del nostro backend
      # ("Connection refused" verso un servizio a caso). Il nome del
      # container e' esplicito e non puo' collidere con nulla sull'host.
      BACKEND_UPSTREAM: cardapp-app:8000
    networks:
      - proxy-net
      - backend
    security_opt:
      - no-new-privileges:true
    # Niente cap_drop qui: l'entrypoint ufficiale di nginx deve fare chown
    # delle cartelle di cache (CAP_CHOWN) e il master, avviato come root,
    # deve poter abbassare i privilegi dei worker (CAP_SETUID/CAP_SETGID).
    # Stesso motivo per cui non e' applicato a db/redis piu' sotto.
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - app

  app:
    build: ../backend
    container_name: cardapp-app
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: postgres:16-alpine
    container_name: cardapp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./db/data:/var/lib/postgresql/data
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cardapp-redis
    restart: unless-stopped
    volumes:
      - ./redis/data:/data
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.25
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Backup locale schedulato (pg_dump del database). Non serve pubblicarlo
  # su una registry: viene buildato direttamente dal sorgente.
  backup:
    build: ../backup
    container_name: cardapp-backup
    restart: unless-stopped
    # crond gira come PID 1: senza un init, il kernel nega alcune operazioni
    # sui gruppi di processo quando lancia i job ("setpgid: Operation not
    # permitted"). init: true fa iniettare a Docker un mini-init (tini).
    init: true
    env_file:
      - .env
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # DAC_OVERRIDE: ./backups sull'host puo' essere di proprieta' dell'utente
    # che ha lanciato install.sh (non root): senza questa capability, root
    # dentro al container non riesce a scriverci ("Permission denied" al
    # primo mkdir del backup), perche' cap_drop: ALL toglie anche il
    # bypass dei permessi Unix di cui root normalmente gode.
    cap_add:
      - DAC_OVERRIDE
    mem_limit: 128m
    cpus: 0.25
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./backups:/backups
    depends_on:
      - db

  # Ricerca/aggiornamento automatico dei loghi negozio in base alle carte
  # aggiunte (app/update_store_logos.py), a intervalli regolari (di default
  # una volta a settimana, LOGO_UPDATE_INTERVAL_HOURS in .env). Riusa
  # l'immagine "app": stesso codice, stesso accesso al database.
  logo-updater:
    build: ../backend
    container_name: cardapp-logo-updater
    restart: unless-stopped
    env_file:
      - .env
    command: ["python", "-m", "app.logo_update_scheduler"]
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    cpus: 0.25
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      db:
        condition: service_healthy

networks:
  proxy-net:
    external: true
  backend:
    internal: true
