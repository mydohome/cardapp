# Deploy di produzione dietro Nginx Proxy Manager (NPM).
#
# Presupposti:
# - Esiste gia' una rete Docker esterna "proxy-net" condivisa con lo stack di NPM
#   (crearla una tantum con: docker network create proxy-net).
# - Le immagini "app" (backend) e "web" (frontend) vengono buildate direttamente
#   sull'host di produzione da questo stesso repository (come lo stack di
#   sviluppo). Se preferisci pubblicarle su una registry (es. per CI/CD) e
#   scaricarle invece di buildarle, sostituisci "build:" con "image:
#   ghcr.io/<org>/cardapp-frontend:latest" (vedi deploy/README.md).
# - In NPM crei un solo Proxy Host che punta a "cardapp-web:80": il frontend
#   fa da unico punto di ingresso e instrada internamente /api/* al backend
#   (vedi frontend/nginx.conf.template), cosi' l'app resta same-origin.

services:
  web:
    build: ../frontend
    container_name: cardapp-web
    restart: unless-stopped
    environment:
      BACKEND_UPSTREAM: app:8000
    networks:
      - proxy-net
      - backend
    security_opt:
      - no-new-privileges:true
    # Niente cap_drop qui: l'entrypoint ufficiale di nginx deve fare chown
    # delle cartelle di cache (CAP_CHOWN) e il master, avviato come root,
    # deve poter abbassare i privilegi dei worker (CAP_SETUID/CAP_SETGID).
    # Stesso motivo per cui non e' applicato a db/redis piu' sotto.
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - app

  app:
    build: ../backend
    container_name: cardapp-app
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: postgres:16-alpine
    container_name: cardapp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./db/data:/var/lib/postgresql/data
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cardapp-redis
    restart: unless-stopped
    volumes:
      - ./redis/data:/data
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.25
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Backup locale schedulato (pg_dump del database). Non serve pubblicarlo
  # su una registry: viene buildato direttamente dal sorgente.
  backup:
    build: ../backup
    container_name: cardapp-backup
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    cpus: 0.25
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./backups:/backups
    depends_on:
      - db

networks:
  proxy-net:
    external: true
  backend:
    internal: true
